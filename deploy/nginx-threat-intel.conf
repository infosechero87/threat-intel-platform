# Nginx reverse proxy for Threat Intelligence Platform
# Place at: /etc/nginx/sites-available/threat-intel
# Enable:   ln -s /etc/nginx/sites-available/threat-intel /etc/nginx/sites-enabled/

# Rate limiting - 30 req/s per IP burst 50
limit_req_zone $binary_remote_addr zone=threatapi:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=threatlogin:10m rate=5r/m;

# Upstream to gunicorn
upstream threat_intel_app {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    server_name _;   # Replace with your domain, e.g. threat.example.com

    # ---- tuning ----
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # ---- security headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # ---- logging ----
    access_log /var/log/nginx/threat-intel-access.log combined buffer=16k flush=5s;
    error_log  /var/log/nginx/threat-intel-error.log warn;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # ---- static files (served directly) ----
    location /static/ {
        alias /opt/threat-intel-platform/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ---- API endpoints ----
    location /api/ {
        limit_req zone=threatapi burst=50 nodelay;
        proxy_pass http://threat_intel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_read_timeout 60s;
    }

    # ---- credential checker (rate-limited) ----
    location /api/check-credentials {
        limit_req zone=threatlogin burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://threat_intel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/check-single {
        limit_req zone=threatlogin burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://threat_intel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---- WebSocket (live alerts) ----
    location /ws/ {
        proxy_pass http://threat_intel_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # ---- main app ----
    location / {
        proxy_pass http://threat_intel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # ---- security: deny hidden files ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# =========================================================================
# HTTPS (certbot will add a second server block on port 443 after you run:
#   certbot --nginx -d your-domain.com
# )
#
# BASIC AUTH (uncomment to password-protect the whole dashboard):
#   apt install apache2-utils
#   htpasswd -c /etc/nginx/.htpasswd admin
#   Then add inside the `location /` block:
#       auth_basic "Threat Intel Platform";
#       auth_basic_user_file /etc/nginx/.htpasswd;
#
# IP WHITELIST (uncomment to restrict access):
#       allow YOUR_HOME_IP;
#       deny all;
# =========================================================================
